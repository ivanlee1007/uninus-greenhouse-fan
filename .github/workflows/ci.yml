name: Repository tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  native-ha:
    # Matrix values are repository-controlled constants, never event text.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        runtime:
          - {ha: '2025.12.0', python: '3.13'}
          - {ha: '2026.10.1', python: '3.14'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.runtime.python }}
      - uses: astral-sh/setup-uv@v6
      - name: Install actual pinned HA (Windows wheel overrides only)
        shell: bash
        env:
          HA_VERSION: ${{ matrix.runtime.ha }}
          RUNNER_PLATFORM: ${{ runner.os }}
        run: |
          uv venv --python python .venv-ha
          EXTRA=()
          if [ "$HA_VERSION" = '2025.12.0' ]; then EXTRA=('pycares==4.11.0'); fi
          if [ "$RUNNER_PLATFORM" = Windows ]; then
            PY=.venv-ha/Scripts/python.exe
            uv pip install --python "$PY" "homeassistant==$HA_VERSION" "${EXTRA[@]}" --override tests_ha/windows-overrides.txt
          else
            PY=.venv-ha/bin/python
            uv pip install --python "$PY" "homeassistant==$HA_VERSION" "${EXTRA[@]}"
          fi
          "$PY" -m unittest discover -s tests_ha -v
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python controller, registry and HA-adapter fakes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lovelace contract tests
        run: node --test tests/test_card.mjs
      - name: Syntax and packaged-card equality
        run: |
          python -m compileall -q custom_components/uninus_greenhouse_fan
          node --check www/uninus-greenhouse-fan-card.js
          node --check custom_components/uninus_greenhouse_fan/card.js
          python -c "from pathlib import Path; assert Path('www/uninus-greenhouse-fan-card.js').read_bytes() == Path('custom_components/uninus_greenhouse_fan/card.js').read_bytes()"
          git diff --check
      - name: Install browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exact-width real Chromium layout and editor tests
        run: |
          python tests/verify_card_browser.py
          python tests/verify_control_browser.py
          python tests/verify_subtitle_browser.py
          python tests/verify_threshold_browser.py
          python tests/verify_refresh_browser.py
          python tests/verify_details_browser.py
          python tests/verify_readings_browser.py
          python tests/verify_icons_browser.py
