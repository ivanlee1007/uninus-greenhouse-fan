name: Repository tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python controller, registry and HA-adapter fakes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: astral-sh/setup-uv@v6
      - name: Install pinned real HA in isolated environment
        run: |
          uv venv --python 3.13 .venv-ha
          uv pip install --python .venv-ha/bin/python -r tests_ha/requirements.txt
      - name: Native HA config/options flows and Store regressions (no fake modules)
        run: .venv-ha/bin/python -m unittest discover -s tests_ha -v
      - name: Lovelace contract tests
        run: node --test tests/test_card.mjs
      - name: Syntax and packaged-card equality
        run: |
          python -m compileall -q custom_components/uninus_greenhouse_fan
          node --check www/uninus-greenhouse-fan-card.js
          node --check custom_components/uninus_greenhouse_fan/card.js
          python -c "from pathlib import Path; assert Path('www/uninus-greenhouse-fan-card.js').read_bytes() == Path('custom_components/uninus_greenhouse_fan/card.js').read_bytes()"
          git diff --check
      - name: Install browser test dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Exact-width real Chromium layout and editor tests
        run: |
          python tests/verify_card_browser.py
          python tests/verify_control_browser.py
          python tests/verify_subtitle_browser.py
