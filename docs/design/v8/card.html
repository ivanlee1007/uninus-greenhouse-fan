const pools={exhaust:[1,2,3,4].map(i=>makeFan(i)),circulation:[1,2,3,4].map(i=>makeFan(i))};
function makeSlot(k,f){return{id:f.id,name:fanName(k,f),temperature_entity:f.temperature_entity,humidity_entity:f.humidity_entity}}
let config={title:'排熱風扇控制',group:'exhaust',theme:'dark',layout:'auto',animation:true,items:[makeSlot('exhaust',pools.exhaust[0])]};
function makeFan(i){return{id:'fan-'+i,temperature_entity:temperatureId(i),humidity_entity:humidityId(i),on:i%3!==0,mode:'auto',pending:null,reason:'保持目前狀態'}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clone(x){return JSON.parse(JSON.stringify(x))}function groupLabel(k){return k==='exhaust'?'排熱':'循環'}function fanName(k,f){return `第 ${f.id.split('-')[1]} 區${groupLabel(k)}風扇`}
function resize(){requestAnimationFrame(()=>parent.postMessage({type:'fan-demo-height',height:Math.ceil($('root').getBoundingClientRect().bottom+scrollY+parseFloat(getComputedStyle(document.body).paddingBottom))},'*'))}
function reading(entity){const s=sensors[entity];if(!s||scenario==='sensor')return null;if(scenario==='hot'&&s.type==='temperature')return 34.5;if(scenario==='low')return s.type==='temperature'?18:45;return s.value}
function evaluateFan(f,k){const p=policies[k],t=reading(f.temperature_entity),h=reading(f.humidity_entity);if(scenario==='offline'){f.pending=null;f.reason='裝置離線，不能下達控制命令';return}if(f.mode!=='auto'){f.pending=null;f.reason='手動保持，按「自動」交回控制';return}if(t===null||h===null){f.pending=null;f.reason='感測異常，保留輸出並暫停自動';return}const target=!f.on&&(t>p.ton||h>p.hon)?true:f.on&&t<=p.toff&&h<=p.hoff?false:null;if(target===null){f.pending=null;f.reason=f.on?'未同時達停止下限，保持開啟':'未達啟動上限，保持關閉';return}if(!f.pending||f.pending.target!==target)f.pending={target,since:clock};const elapsed=clock-f.pending.since;if(elapsed>=p.duration){f.on=target;f.pending=null;f.reason=target?'條件已持續，已自動開啟':'條件已持續，已自動關閉'}else f.reason=`${target?'待開啟':'待關閉'} · 尚需 ${p.duration-elapsed} 秒`}
function evaluateAll(){for(const[k,fs]of Object.entries(pools))fs.forEach(f=>evaluateFan(f,k))}
function machine(circular){return `<div class="fan-machine ${circular?'circulation':''}"><i class="bolt tl"></i><i class="bolt tr"></i><i class="bolt bl"></i><i class="bolt br"></i><div class="fan-wheel"><div class="rotor"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="blade" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#bbc9c6"/><stop offset=".55" stop-color="#758f91"/><stop offset="1" stop-color="#3f666f"/></linearGradient></defs><g fill="url(#blade)"><path d="M48 48 C15 50 9 23 28 13 C43 6 58 21 48 48Z"/><path d="M48 48 C15 50 9 23 28 13 C43 6 58 21 48 48Z" transform="rotate(90 50 50)"/><path d="M48 48 C15 50 9 23 28 13 C43 6 58 21 48 48Z" transform="rotate(180 50 50)"/><path d="M48 48 C15 50 9 23 28 13 C43 6 58 21 48 48Z" transform="rotate(270 50 50)"/></g></svg></div><div class="cage"></div><div class="hub"></div></div></div>`}
// innerHTML templates use fixed markup, validated finite numbers and HTML-escaped names/IDs only.
function fanHTML(slot){const f=pools[config.group].find(x=>x.id===slot.id),t=reading(slot.temperature_entity),h=reading(slot.humidity_entity),offline=scenario==='offline',bad=t===null||h===null,state=offline?'未知':f.on?'已開啟':'已關閉';const reason=f.reason;return `<article class="fan-item ${f.on&&!offline?'running':'off'} ${bad||offline?'error':''} ${offline?'device-offline':''}" data-id="${f.id}"><header class="device-title"><h3 title="${esc(slot.name)}">${esc(slot.name)}</h3><span class="badge">● ${state}</span></header><div class="device-hero"><div class="scene">${machine(config.group==='circulation')}</div><div class="live-status"><div class="live-line metric ${t===null?'unavailable':''}" title="${esc(slot.temperature_entity)}"><span class="live-key">目前溫度</span><strong>${t===null?'—':t.toFixed(1)}<small> °C</small></strong></div><div class="live-line metric ${h===null?'unavailable':''}" title="${esc(slot.humidity_entity)}"><span class="live-key">目前濕度</span><strong>${h===null?'—':h.toFixed(1)}<small> %</small></strong></div></div></div><div class="device-details"><div class="mode-row"><span>控制模式</span><b>${f.mode==='auto'?'自動':f.mode==='manual_on'?'手動開啟':'手動關閉'}</b><span class="feedback">開關回報</span></div><p class="reason ${bad||offline?'error':''}" title="${esc(reason)}">${esc(reason)}</p></div><div class="controls"><button data-command="on" data-id="${f.id}" ${offline?'disabled':''} class="${f.mode==='manual_on'?'selected':''}" aria-label="${esc(slot.name)}手動開啟">手動開啟</button><button data-command="off" data-id="${f.id}" ${offline?'disabled':''} class="${f.mode==='manual_off'?'selected':''}" aria-label="${esc(slot.name)}手動關閉">手動關閉</button>${f.mode!=='auto'?`<button class="resume" data-command="auto" data-id="${f.id}" ${offline?'disabled':''} aria-label="${esc(slot.name)}恢復自動">恢復自動</button>`:''}</div></article>`}
function globalHTML(){const p=policies[config.group],pending=pools[config.group].filter(f=>f.pending).length;return `<details id="global" class="global" ${expanded?'open':''}><summary aria-label="全域溫濕度上下限，展開或收折"><span class="limit-pair"><span>溫度 ↑／↓</span><b>${p.ton} / ${p.toff} °C</b></span><span class="limit-pair"><span>濕度 ↑／↓</span><b>${p.hon} / ${p.hoff} %</b></span></summary><div class="global-body"><h2>${groupLabel(config.group)}控制群組</h2><dl><div><dt>持續時間</dt><dd>${p.duration} 秒</dd></div><div><dt>共用／顯示</dt><dd>${pools[config.group].length}／${config.items.length} 台</dd></div><div><dt>條件計時中</dt><dd>${pending} 台</dd></div></dl><p class="rules"><strong>開：</strong>溫度 &gt; ${p.ton}°C <strong>或</strong> 濕度 &gt; ${p.hon}%<br><strong>關：</strong>溫度 ≤ ${p.toff}°C <strong>且</strong> 濕度 ≤ ${p.hoff}%<br>使用各台指定 Entity，條件持續滿 ${p.duration} 秒才切換。</p></div></details>`}
function renderDisplay(){const previous=$('global');if(previous)expanded=previous.open;document.documentElement.dataset.theme=config.theme;const fs=config.items.map(s=>pools[config.group].find(f=>f.id===s.id));$('root').innerHTML=`<section class="card count-${config.items.length} ${config.animation?'':'no-animation'} layout-${config.layout}"><header class="header"><div><div class="brand">UNiNUS / GREENHOUSE</div><h1>${esc(config.title)}</h1><p class="sub">各區獨立感測 · 同群組共用門檻</p></div><span class="summary">${scenario==='offline'?`${fs.length} 台未知`:`● ${fs.filter(f=>f.on).length} / ${fs.length} 台開啟`}</span></header><div class="workspace ${expanded?'expanded':''}">${globalHTML()}<div class="fans">${config.items.map(fanHTML).join('')}</div></div><p class="card-note">動畫依開關回報模擬 · 手動保持至恢復自動</p></section>`;const el=$('global');el.addEventListener('toggle',()=>{if(!el.isConnected||$('global')!==el)return;if(expanded!==el.open){expanded=el.open;renderDisplay()}else resize()});resize()}
function status(text,error=false){const e=$('status');if(e){e.textContent=text;e.classList.toggle('error',error)}resize()}
function cardOpts(){return pools[cardDraft.group].map(f=>`<option value="${f.id}">${fanName(cardDraft.group,f)}</option>`).join('')}
function sensorOptions(type){return Object.entries(sensors).filter(([,s])=>s.type===type).map(([id,s])=>`<option value="${id}">${esc(s.label)} · ${esc(id)}</option>`).join('')}
function slotHTML(s,i){return `<div class="slot"><div class="slot-head"><strong>顯示項目 ${i+1}</strong><div class="slot-actions"><button data-move="${i}" data-offset="-1" ${i===0?'disabled':''} aria-label="上移">↑</button><button data-move="${i}" data-offset="1" ${i===cardDraft.items.length-1?'disabled':''} aria-label="下移">↓</button><button data-remove="${i}" aria-label="移除顯示">×</button></div></div><div class="fields"><div class="field"><label for="fan-${i}">風扇實體</label><select id="fan-${i}" data-slot="${i}">${cardOpts()}</select></div><div class="field"><label for="name-${i}">顯示名稱</label><input id="name-${i}" value="${esc(s.name)}"></div><div class="field"><label for="slot-temp-${i}">溫度實體</label><select id="slot-temp-${i}" data-card-temp="${i}">${sensorOptions('temperature')}</select></div><div class="field"><label for="slot-hum-${i}">濕度實體</label><select id="slot-hum-${i}" data-card-hum="${i}">${sensorOptions('humidity')}</select></div></div><p class="source-info">此處設定的來源，同時用於卡片即時顯示與該風扇的後端自動判斷；儲存後同步模擬綁定。</p></div>`}
function cardEditor(){return `<section class="section"><h2>卡片外觀</h2><div class="fields"><div class="field wide"><label for="title">卡片標題</label><input id="title" value="${esc(cardDraft.title)}"></div><div class="field"><label for="group">控制群組</label><select id="group"><option value="exhaust">排熱風扇</option><option value="circulation">循環風扇</option></select></div><div class="field"><label for="theme">主題</label><select id="theme"><option value="dark">深夜石墨</option><option value="light">雲霧白</option></select></div><div class="field"><label for="layout">每列設備數</label><select id="layout"><option value="auto">自動排列</option><option value="1">1 欄</option><option value="2">2 欄</option></select></div><label class="check-label"><input id="animation" type="checkbox" ${cardDraft.animation?'checked':''}>顯示風扇動畫</label></div></section><section class="section"><h2>風扇顯示項目 · ${cardDraft.items.length} 台</h2>${cardDraft.items.map(slotHTML).join('')}<button id="add" class="primary" ${cardDraft.items.length===4?'disabled':''}>${cardDraft.items.length===4?'四台示範設備皆已加入':'＋ 新增顯示項目'}</button><p class="help">移除只影響卡片顯示，不刪除既有後端設備綁定；每項可分別選風扇、名稱、溫度及濕度實體。Demo 只有四台設備。</p></section><footer class="footer"><span id="status" class="status" role="status">卡片設定草稿 · 尚未儲存</span><button id="cancel-card">取消</button><button id="save-card" class="primary">儲存卡片設定</button></footer>`}
function backendEditor(){const p=backendDraft.policy;return `<div class="notice">${groupLabel(config.group)}群組 · Integration 只設定共用門檻與持續秒數。<br>各台風扇的溫／濕度 Entity 在「卡片顯示設定」逐項選擇；儲存卡片設定時，Demo 同步更新顯示與自動控制來源，不再有重複的 Integration 來源表單。</div><section class="section"><h2>全域門檻與持續時間</h2><div class="fields">${[['ton','啟動溫度上限（°C）'],['toff','停止溫度下限（°C）'],['hon','啟動濕度上限（%）'],['hoff','停止濕度下限（%）']].map(([k,label])=>`<div class="field"><label for="${k}">${label}</label><input id="${k}" type="number" step="0.1" value="${p[k]}"></div>`).join('')}<div class="field"><label for="duration">條件持續秒數（開／關共用）</label><input id="duration" type="number" min="0" max="86400" step="1" value="${p.duration}"></div></div><p class="help">任一超上限開啟；兩項都達下限才關閉。必須持續滿設定秒數；0 秒代表立即判斷。</p></section><footer class="footer"><span id="status" class="status" role="status">後端設定草稿 · 尚未儲存</span><button id="cancel-backend">還原修改</button><button id="save-backend" class="primary">儲存 Integration 設定</button></footer>`}
function renderSettings(){if(!cardDraft)cardDraft=clone(config);if(!backendDraft)backendDraft={group:config.group,policy:clone(policies[config.group])};$('root').innerHTML=`<section class="editor"><header class="editor-header"><div><h1>風扇卡片設定</h1><p>設定頁與正式顯示分開 · C 工作台版</p></div><span class="badge">離線 Demo</span></header><nav class="tabs"><button data-tab="card" class="${tab==='card'?'active':''}">卡片顯示設定</button><button data-tab="integration" class="${tab==='integration'?'active':''}">Integration 設定</button></nav>${tab==='card'?cardEditor():backendEditor()}</section>`;if(tab==='card'){$('group').value=cardDraft.group;$('theme').value=cardDraft.theme;$('layout').value=cardDraft.layout;cardDraft.items.forEach((s,i)=>{$('fan-'+i).value=s.id;$('slot-temp-'+i).value=s.temperature_entity;$('slot-hum-'+i).value=s.humidity_entity})}resize()}
function capture(){if(view!=='settings')return;if(tab==='card'&&cardDraft&&$('title')){cardDraft.title=$('title').value;cardDraft.theme=$('theme').value;cardDraft.layout=$('layout').value;cardDraft.animation=$('animation').checked;cardDraft.items=cardDraft.items.map((s,i)=>({id:$('fan-'+i).value,name:$('name-'+i).value,temperature_entity:$('slot-temp-'+i).value,humidity_entity:$('slot-hum-'+i).value}))}if(tab==='integration'&&backendDraft&&$('duration')){policyKeys.forEach(k=>{backendDraft.policy[k]=$(k).value.trim()===''?NaN:Number($(k).value)})}}
function show(next){capture();view=next==='settings'?'settings':'display';if(view==='display'){evaluateAll();renderDisplay()}else renderSettings();parent.postMessage({type:'fan-demo-view-state',view},'*')}
$('root').addEventListener('input',()=>{capture();status('草稿未儲存，正式畫面與控制不變')});$('root').addEventListener('change',e=>{capture();if(e.target.id==='group'){cardDraft.group=e.target.value;cardDraft.title=groupLabel(cardDraft.group)+'風扇控制';cardDraft.items=[makeSlot(cardDraft.group,pools[cardDraft.group][0])];renderSettings()}if(e.target.matches('[data-slot]')){const i=Number(e.target.dataset.slot);const f=pools[cardDraft.group].find(f=>f.id===cardDraft.items[i].id);cardDraft.items[i]=makeSlot(cardDraft.group,f);renderSettings()}});
$('root').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
if(b.dataset.command){const f=pools[config.group].find(x=>x.id===b.dataset.id);f.pending=null;if(b.dataset.command==='auto')f.mode='auto';else{f.on=b.dataset.command==='on';f.mode=f.on?'manual_on':'manual_off'}evaluateAll();renderDisplay();return}
if(b.dataset.tab){capture();tab=b.dataset.tab;renderSettings();return}
if(b.id==='add'){capture();const f=pools[cardDraft.group].find(f=>!cardDraft.items.some(s=>s.id===f.id));if(f)cardDraft.items.push(makeSlot(cardDraft.group,f));renderSettings();return}
if(b.hasAttribute('data-remove')){capture();cardDraft.items.splice(Number(b.dataset.remove),1);renderSettings();return}
if(b.hasAttribute('data-move')){capture();const i=Number(b.dataset.move),j=i+Number(b.dataset.offset);[cardDraft.items[i],cardDraft.items[j]]=[cardDraft.items[j],cardDraft.items[i]];renderSettings();return}
if(b.id==='cancel-card'){cardDraft=null;view='display';show('display');return}
if(b.id==='save-card'){capture();if(!cardDraft.title.trim()||!cardDraft.items.length||cardDraft.items.some(s=>!s.name.trim())||new Set(cardDraft.items.map(s=>s.id)).size!==cardDraft.items.length)return status('請設定標題、名稱及不重複的風扇項目',true);if(cardDraft.items.some(s=>!pools[cardDraft.group].some(f=>f.id===s.id)||sensors[s.temperature_entity]?.type!=='temperature'||sensors[s.humidity_entity]?.type!=='humidity'))return status('每個顯示項目必須選有效的風扇／溫度／濕度實體',true);const changed=config.group!==cardDraft.group;const proposed=clone(cardDraft);/* Mock atomic commit: only publish both after all bindings validate. */for(const slot of proposed.items){const f=pools[proposed.group].find(f=>f.id===slot.id);f.temperature_entity=slot.temperature_entity;f.humidity_entity=slot.humidity_entity;f.pending=null}config=proposed;cardDraft=null;if(changed)backendDraft=null;view='display';show('display');return}
if(b.id==='cancel-backend'){backendDraft=null;renderSettings();return}
if(b.id==='save-backend'){capture();const p=backendDraft.policy;if(policyKeys.some(k=>!Number.isFinite(p[k]))||p.ton<-20||p.ton>80||p.toff<-20||p.toff>80||p.hon<0||p.hon>100||p.hoff<0||p.hoff>100)return status('溫度須為 -20–80°C，濕度須為 0–100%',true);if(p.toff>=p.ton||p.hoff>=p.hon)return status('停止下限必須小於啟動上限',true);if(!Number.isInteger(p.duration)||p.duration<0||p.duration>86400)return status('持續秒數須為 0–86400 的整數',true);policies[config.group]=clone(p);evaluateAll();backendDraft=null;renderSettings();status('已儲存模擬 Integration 全域門檻及持續秒數');return}
});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));window.addEventListener('resize',resize);window.addEventListener('message',e=>{if(e.source!==parent)return;const d=e.data;if(d?.type==='fan-demo-view')show(d.view);if(d?.type==='fan-demo-theme'){config.theme=d.theme;if(cardDraft)cardDraft.theme=d.theme;document.documentElement.dataset.theme=d.theme;resize()}if(d?.type==='fan-demo-fixture'){capture();scenario=d.scenario||'normal';if(d.count)config.items=pools[config.group].slice(0,d.count===4?4:1).map(f=>makeSlot(config.group,f));pools[config.group].forEach(f=>f.pending=null);if(scenario==='hot')pools[config.group].forEach(f=>{f.on=false;f.mode='auto'});if(scenario==='low')pools[config.group].forEach(f=>{f.on=true;f.mode='auto'});cardDraft=null;backendDraft=null;view='display';show('display')}if(d?.type==='fan-demo-advance'){if(!Number.isInteger(d.seconds)||d.seconds<=0||d.seconds>3600)return;clock+=d.seconds;evaluateAll();if(view==='display')renderDisplay();parent.postMessage({type:'fan-demo-clock',seconds:clock},'*')}});document.body.classList.toggle('embedded',parent!==window);show('display');
</script></body></html>
